name: Manuell deploy av alle Kafka-topicer til dev
on:
  workflow_dispatch:

concurrency:
  group: kafka-dev-all-topics
  cancel-in-progress: false

jobs:
  deploy-dev-manual:
    name: Manuell deploy av alle Kafka-topicer til dev
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Deploy pto-topicer
        uses: nais/deploy/actions/deploy@d003bddf74ce5b96fa3056ae60bd4b9b3bbc89ef # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          TEAM: pto
          RESOURCE: >-
            .nais/kafka/dev/siste-14a-vedtak-v1-topic.yaml,
            .nais/kafka/dev/vedtak-14a-fattet-dvh-v1.yaml,
            .nais/kafka/dev/vedtak-14a-statusendring-v1-topic.yaml,
            .nais/kafka/dev/vedtak-sendt-v1-topic.yaml
          PRINT_PAYLOAD: true
      - name: Deploy obo-topic
        uses: nais/deploy/actions/deploy@d003bddf74ce5b96fa3056ae60bd4b9b3bbc89ef # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          TEAM: obo
          RESOURCE: .nais/kafka/dev/gjeldende-14a-vedtak-v1-topic.yaml
          PRINT_PAYLOAD: true
