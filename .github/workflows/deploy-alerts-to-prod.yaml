name: Deploy alerts for veilarbvedtaksstotte to prod-gcp

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/deploy-alerts-to-prod.yaml'
      - '.nais/alerts/alerts-config-prod.yaml'
  workflow_dispatch:

jobs:
  deploy-alerts:
    name: Deploy alerts to prod-gcp
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Deploy to prod-gcp
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/alerts/alerts-config-prod.yaml
