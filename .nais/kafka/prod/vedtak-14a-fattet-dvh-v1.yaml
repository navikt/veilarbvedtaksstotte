apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: vedtak-14a-fattet-dvh-v1
  namespace: pto
  labels:
    team: pto
spec:
  pool: nav-prod
  config:
    cleanupPolicy: delete
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 2
    retentionHours: 1440 # 60 days
  acl:
    - team: obo
      application: veilarbvedtaksstotte
      access: write
    - team: pto
      application: pto-kafka-manager
      access: read
    - team: obo
      application: obo-kafka-manager
      access: read
    - team: teamoppfolging
      application: dvh-kartlegging-konsument
      access: read
    - team: teamoppfolging
      application: teamoppfolging-kafka
      access: read
