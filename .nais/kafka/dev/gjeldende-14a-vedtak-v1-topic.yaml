apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: gjeldende-14a-vedtak-v1
  namespace: obo
  labels:
    team: obo
spec:
  pool: nav-dev
  config:
    cleanupPolicy: compact
    minimumInSyncReplicas: 1
    partitions: 2
    replication: 2
  acl:
    - team: obo
      application: veilarbvedtaksstotte
      access: write
    - team: obo
      application: obo-kafka-manager
      access: read