apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: siste-14a-vedtak-v1
  namespace: pto
  labels:
    team: pto
spec:
  pool: nav-dev
  config:
    cleanupPolicy: compact
    minimumInSyncReplicas: 1
    partitions: 1
    replication: 2
  acl:
    - team: obo
      application: veilarbvedtaksstotte
      access: write
    - team: obo
      application: veilarbportefolje
      access: read
    - team: pto
      application: pto-kafka-manager
      access: read
    - team: obo
      application: obo-kafka-manager
      access: read
    - team: toi
      application: toi-siste-14a-vedtak
      access: read
    - team: amt
      application: amt-person-service
      access: read
    - team: paw
      application: paw-microfrontend-toggler
      access: read
    - team: paw
      application: paw-arbeidssoekerregisteret-api-mine-stillinger
      access: read